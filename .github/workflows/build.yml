name: Build Check

on:
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm' # change to "yarn" or "pnpm" if you use that

            - name: Install dependencies
              run: npm ci # or `yarn install --frozen-lockfile` / `pnpm install --frozen-lockfile`

            - name: Build project
              run: npm run build # replace with your repo's standard build command (e.g., `npx tsc --noEmit` or `yarn build`)
